[package]
name = "ora"
version = "0.1.0"
edition = "2024"

[dependencies]
winit = "0.30"
wgpu = { version = "28", default-features = false, features = ["wgsl", "dx12", "vulkan", "metal"] }
generational-arena = "0.2"
pollster = "0.4"
log = "0.4"
bytemuck = { version = "1", features = ["derive"] }
glyphon = "0.10"
# glyphon 0.10 brings the Y-axis clipping fix + cosmic-text 0.15 pixel-based
# scroll / ASCII fast path / is_run_visible fix. Requires wgpu 28 and rustc 1.92
# (pinned in /rust-toolchain.toml).
async-executor = "1"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal"] }
futures-lite = "2"
image = "0.24"
lru = "0.12"

[dev-dependencies]
env_logger = "0.11"
