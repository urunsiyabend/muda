[package]
name = "mudatexteditor"
version = "0.1.0"
edition = "2024"

[dependencies]
ropey = "1.6.1"
ratatui = "0.29.0"
crossterm = "0.29.0"
arboard = "3.6.1"
log = "0.4.29"
simplelog = "0.12.2"
tree-sitter = "0.26.3"
tree-sitter-rust = "0.24.0"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-toml = "0.20.0"
tree-sitter-md = "0.5.1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"

[[bench]]
name = "editor_benchmarks"
harness = false

[[bench]]
name = "text_buffer_benchmarks"
harness = false

[[bench]]
name = "syntax_benchmarks"
harness = false

[[bench]]
name = "render_benchmarks"
harness = false
